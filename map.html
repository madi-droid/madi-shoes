<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADIYAR Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #dfd8c0;
    }
    /* Стилизуем элементы Leaflet под винтажную тему Plenkacore */
    .leaflet-bar {
      border: 1px solid #2a2215 !important;
      box-shadow: none !important;
      border-radius: 4px;
      overflow: hidden;
    }
    .leaflet-bar a {
      background-color: #dfd8c0 !important;
      color: #2a2215 !important;
      border-bottom: 1px solid #c8bfa6 !important;
      transition: background 0.2s;
    }
    .leaflet-bar a:hover {
      background-color: #cfc7ad !important;
      color: #2a2215 !important;
    }
    .leaflet-popup-content-wrapper {
      background: #dfd8c0 !important;
      color: #2a2215 !important;
      border: 1px solid #2a2215;
      border-radius: 6px;
      font-family: sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important;
    }
    .leaflet-popup-tip {
      background: #dfd8c0 !important;
      border: 1px solid #2a2215;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // Получаем параметры из URL и проверяем их
    const urlParams = new URLSearchParams(window.location.search);
    let lat = parseFloat(urlParams.get('lat'));
    let lon = parseFloat(urlParams.get('lon'));

    if (isNaN(lat) || lat < -90 || lat > 90) lat = 40.774518;
    if (isNaN(lon) || lon < -180 || lon > 180) lon = 68.322906;
    const title = urlParams.get('title') || 'Бутик MADIYAR';
    // Экранируем HTML, чтобы предотвратить XSS через параметр title
    const escapeHtml = (str) => String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

    // Инициализируем карту
    const map = L.map('map', {
      zoomControl: true,
      scrollWheelZoom: true
    }).setView([lat, lon], 17);

    // Подгружаем слой OpenStreetMap тайлов
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Добавляем маркер
    const marker = L.marker([lat, lon]).addTo(map);
    marker.bindPopup(`<b>${escapeHtml(title)}</b>`).openPopup();
  </script>
</body>
</html>
